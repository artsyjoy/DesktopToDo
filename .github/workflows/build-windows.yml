name: Build DeskTodo for Windows

on:
  push:
    paths: ["desktodo.pyw", "fonts/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name DeskTodo --add-data "fonts;fonts" desktodo.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: DeskTodo-windows
          path: dist/DeskTodo.exe
