name: Build DeskTodo for Windows

on:
  push:
    paths: ["desktodo.pyw", "fonts/**", "assets/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller tzdata
      # Checks live weather + city search and the Outlook calendar parser on Windows.
      - run: python desktodo.pyw --selftest
      - run: >
          pyinstaller --onefile --windowed --name DeskTodo
          --icon assets/desktodo.ico
          --add-data "fonts;fonts" --add-data "assets;assets"
          --collect-data tzdata --hidden-import tzdata
          desktodo.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: DeskTodo-windows
          path: dist/DeskTodo.exe
